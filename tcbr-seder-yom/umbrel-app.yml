tagline: לוח זמנים משפחתי – שגרות, משימות והצלבה בין לוחות
description: >-
  סדר יום הוא לוח זמנים ביתי בהתקנה עצמית. משבצים בו שגרות ומשימות שקורות קבוע בשעות קבועות,
  רואים אותן בתצוגת יום, שבוע או חודש, ומשתפים את הלוח עם שאר בני הבית.


  לכל אחד מבני הבית חשבון משלו. בלוח המשולב רואים את הזמנים של כולם זה לצד זה, יחד עם
  התנגשויות, חלונות זמן שבהם כולם פנויים וחלוקת מטלות הבית.


  בכניסה הראשונה יוצרים את חשבון המנהל; שאר בני הבית מצטרפים דרך קישור הזמנה מתוך ההגדרות.
