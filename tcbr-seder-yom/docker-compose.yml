version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tcbr-seder-yom_web_1
      APP_PORT: 3000
      # The app has its own accounts, one per household member, so Umbrel's single-password
      # login screen in front of it is turned off.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/tcbr10/time_management_system:1.0.0
    restart: on-failure
    stop_grace_period: 30s
    user: "1000:1000"
    environment:
      TZ: Asia/Jerusalem
    volumes:
      - ${APP_DATA_DIR}/data:/data
